name: phpforge

services:
  mysql:
    image: mysql:9.7
    profiles: [mysql]
    ports: ["3306:3306"]
    environment: &mysql-environment
      MYSQL_DATABASE: ${PHPFORGE_SERVICE_DATABASE:-phpforge}
      MYSQL_USER: ${PHPFORGE_SERVICE_USERNAME:-phpforge}
      MYSQL_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
      MYSQL_ROOT_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
    healthcheck: &mysql-health
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  mysql-primary:
    image: mysql:9.7
    profiles: [mysql-replica]
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    ports: ["3306:3306"]
    environment: *mysql-environment
    volumes:
      - ./mysql/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck: *mysql-health

  mysql-replica:
    image: mysql:9.7
    profiles: [mysql-replica]
    command: ["--server-id=2", "--relay-log=mysql-relay-bin", "--read-only=ON", "--gtid-mode=ON", "--enforce-gtid-consistency=ON"]
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
    healthcheck: *mysql-health

  mysql-replica-init:
    image: mysql:9.7
    profiles: [mysql-replica]
    depends_on:
      mysql-primary: {condition: service_healthy}
      mysql-replica: {condition: service_healthy}
    environment: *mysql-environment
    volumes:
      - ./mysql/configure-replica.sh:/configure-replica.sh:ro
    entrypoint: ["bash", "/configure-replica.sh"]

  mariadb:
    image: mariadb:12.3
    profiles: [mariadb]
    ports: ["3308:3306"]
    environment: &mariadb-environment
      MARIADB_DATABASE: ${PHPFORGE_SERVICE_DATABASE:-phpforge}
      MARIADB_USER: ${PHPFORGE_SERVICE_USERNAME:-phpforge}
      MARIADB_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
      MARIADB_ROOT_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
    healthcheck: &mariadb-health
      test: [CMD-SHELL, "healthcheck.sh --connect --innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb-primary:
    image: mariadb:12.3
    profiles: [mariadb-replica]
    command: ["--server-id=1", "--log-bin=mariadb-bin", "--binlog-format=ROW"]
    ports: ["3308:3306"]
    environment: *mariadb-environment
    volumes:
      - ./mariadb/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck: *mariadb-health

  mariadb-replica:
    image: mariadb:12.3
    profiles: [mariadb-replica]
    command: ["--server-id=2", "--relay-log=mariadb-relay-bin", "--read-only=ON"]
    ports: ["3309:3306"]
    environment:
      MARIADB_ROOT_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
    healthcheck: *mariadb-health

  mariadb-replica-init:
    image: mariadb:12.3
    profiles: [mariadb-replica]
    depends_on:
      mariadb-primary: {condition: service_healthy}
      mariadb-replica: {condition: service_healthy}
    environment: *mariadb-environment
    volumes:
      - ./mariadb/configure-replica.sh:/configure-replica.sh:ro
    entrypoint: ["bash", "/configure-replica.sh"]

  postgres:
    image: postgres:18-alpine
    profiles: [postgres]
    ports: ["5432:5432"]
    environment: &postgres-environment
      POSTGRES_DB: ${PHPFORGE_SERVICE_DATABASE:-phpforge}
      POSTGRES_USER: ${PHPFORGE_SERVICE_USERNAME:-phpforge}
      POSTGRES_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres-primary:
    image: postgres:18-alpine
    profiles: [postgres-replica]
    ports: ["5432:5432"]
    environment: &postgres-replica-environment
      POSTGRES_DB: ${PHPFORGE_SERVICE_DATABASE:-phpforge}
      POSTGRES_USER: ${PHPFORGE_SERVICE_USERNAME:-phpforge}
      POSTGRES_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
      POSTGRES_REPLICATION_USER: phpforge_repl
      POSTGRES_REPLICATION_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
    volumes:
      - ./postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres-replica:
    image: postgres:18-alpine
    profiles: [postgres-replica]
    ports: ["5433:5432"]
    depends_on:
      postgres-primary: {condition: service_healthy}
    environment: *postgres-replica-environment
    volumes:
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["sh", "/replica-entrypoint.sh"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 40

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: [mssql]
    ports: ["1433:1433"]
    environment: &mssql-environment
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
    healthcheck: &mssql-health
      test: [CMD-SHELL, "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

  mssql-shared-init:
    image: alpine:3.24
    profiles: [mssql-availability-group]
    user: root
    volumes:
      - mssql-shared:/shared
    command: ["sh", "-c", "chmod 0777 /shared"]

  mssql-primary:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: [mssql-availability-group]
    hostname: mssql-primary
    ports: ["1433:1433"]
    environment: *mssql-environment
    depends_on:
      mssql-shared-init: {condition: service_completed_successfully}
    volumes:
      - mssql-shared:/var/opt/mssql/shared
      - ./mssql/mssql.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck: *mssql-health

  mssql-replica:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: [mssql-availability-group]
    hostname: mssql-replica
    ports: ["1434:1433"]
    environment: *mssql-environment
    depends_on:
      mssql-shared-init: {condition: service_completed_successfully}
    volumes:
      - mssql-shared:/var/opt/mssql/shared
      - ./mssql/mssql.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck: *mssql-health

  mssql-availability-group-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    profiles: [mssql-availability-group]
    environment:
      <<: *mssql-environment
      PHPFORGE_SERVICE_DATABASE: ${PHPFORGE_SERVICE_DATABASE:-phpforge}
    depends_on:
      mssql-primary: {condition: service_healthy}
      mssql-replica: {condition: service_healthy}
    volumes:
      - mssql-shared:/var/opt/mssql/shared
      - ./mssql/configure-availability-group.sh:/configure-availability-group.sh:ro
    entrypoint: ["bash", "/configure-availability-group.sh"]

  mongodb:
    image: mongo:8.3
    profiles: [mongodb]
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_DATABASE: ${PHPFORGE_SERVICE_DATABASE:-phpforge}
      MONGO_INITDB_ROOT_USERNAME: ${PHPFORGE_SERVICE_USERNAME:-phpforge}
      MONGO_INITDB_ROOT_PASSWORD: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --username '$${MONGO_INITDB_ROOT_USERNAME}' --password '$${MONGO_INITDB_ROOT_PASSWORD}' --authenticationDatabase admin --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 1)'"]
      interval: 3s
      timeout: 5s
      retries: 40

  mongodb-primary:
    image: mongo:8.3
    profiles: [mongodb-replica]
    command: ["mongod", "--replSet", "phpforge-rs", "--bind_ip_all", "--port", "27017"]
    ports: ["27017:27017"]
    healthcheck: &mongodb-replica-health
      test: [CMD-SHELL, "mongosh --quiet --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 1)'"]
      interval: 3s
      timeout: 5s
      retries: 40

  mongodb-secondary:
    image: mongo:8.3
    profiles: [mongodb-replica]
    command: ["mongod", "--replSet", "phpforge-rs", "--bind_ip_all", "--port", "27017"]
    ports: ["27018:27017"]
    healthcheck: *mongodb-replica-health

  mongodb-replica-init:
    image: mongo:8.3
    profiles: [mongodb-replica]
    depends_on:
      mongodb-primary: {condition: service_healthy}
      mongodb-secondary: {condition: service_healthy}
    volumes:
      - ./mongodb/configure-replica.js:/configure-replica.js:ro
    entrypoint: ["mongosh", "--host", "mongodb-primary", "--file", "/configure-replica.js"]

  redis:
    image: redis:8.10-alpine
    profiles: [redis]
    command: ["redis-server", "--requirepass", "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}"]
    ports: ["6379:6379"]
    healthcheck:
      test: [CMD, redis-cli, -a, "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}", ping]
      interval: 3s
      timeout: 3s
      retries: 30

  redis-primary:
    image: redis:8.10-alpine
    profiles: [redis-replica]
    command: ["redis-server", "--requirepass", "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}"]
    ports: ["6379:6379"]
    healthcheck: &redis-replica-health
      test: [CMD, redis-cli, -a, "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}", ping]
      interval: 3s
      timeout: 3s
      retries: 30

  redis-replica:
    image: redis:8.10-alpine
    profiles: [redis-replica]
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--masterauth", "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}", "--requirepass", "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}", "--replica-read-only", "yes"]
    ports: ["6381:6379"]
    depends_on:
      redis-primary: {condition: service_healthy}
    healthcheck: *redis-replica-health

  valkey:
    image: valkey/valkey:9.1-alpine
    profiles: [valkey]
    command: ["valkey-server", "--requirepass", "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}"]
    ports: ["6380:6379"]
    healthcheck:
      test: [CMD, valkey-cli, -a, "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}", ping]
      interval: 3s
      timeout: 3s
      retries: 30

  valkey-primary:
    image: valkey/valkey:9.1-alpine
    profiles: [valkey-replica]
    command: ["valkey-server", "--requirepass", "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}"]
    ports: ["6380:6379"]
    healthcheck: &valkey-replica-health
      test: [CMD, valkey-cli, -a, "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}", ping]
      interval: 3s
      timeout: 3s
      retries: 30

  valkey-replica:
    image: valkey/valkey:9.1-alpine
    profiles: [valkey-replica]
    command: ["valkey-server", "--replicaof", "valkey-primary", "6379", "--masterauth", "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}", "--requirepass", "${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}", "--replica-read-only", "yes"]
    ports: ["6382:6379"]
    depends_on:
      valkey-primary: {condition: service_healthy}
    healthcheck: *valkey-replica-health

  memcached:
    image: memcached:1.6.45-alpine
    profiles: [memcached]
    ports: ["11211:11211"]
    healthcheck:
      test: [CMD-SHELL, "printf 'version\\r\\n' | nc 127.0.0.1 11211 | grep -q VERSION"]
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    profiles: [rabbitmq]
    ports: ["5672:5672", "15672:15672"]
    environment: &rabbitmq-environment
      RABBITMQ_DEFAULT_USER: ${PHPFORGE_SERVICE_USERNAME:-phpforge}
      RABBITMQ_DEFAULT_PASS: ${PHPFORGE_SERVICE_PASSWORD:-Phpforge_123!}
    healthcheck: &rabbitmq-health
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 5s
      retries: 40

  rabbitmq-primary:
    image: rabbitmq:4.3-management-alpine
    profiles: [rabbitmq-cluster]
    hostname: rabbitmq-primary
    ports: ["5672:5672", "15672:15672"]
    environment:
      <<: *rabbitmq-environment
      RABBITMQ_ERLANG_COOKIE: PHPForgeRabbitCookie1234567890
      RABBITMQ_NODENAME: rabbit@rabbitmq-primary
    healthcheck: *rabbitmq-health

  rabbitmq-replica-1:
    image: rabbitmq:4.3-management-alpine
    profiles: [rabbitmq-cluster]
    hostname: rabbitmq-replica-1
    ports: ["5673:5672", "15673:15672"]
    environment:
      <<: *rabbitmq-environment
      RABBITMQ_ERLANG_COOKIE: PHPForgeRabbitCookie1234567890
      RABBITMQ_NODENAME: rabbit@rabbitmq-replica-1
    depends_on:
      rabbitmq-primary: {condition: service_healthy}
    healthcheck: *rabbitmq-health

  rabbitmq-replica-2:
    image: rabbitmq:4.3-management-alpine
    profiles: [rabbitmq-cluster]
    hostname: rabbitmq-replica-2
    ports: ["5674:5672", "15674:15672"]
    environment:
      <<: *rabbitmq-environment
      RABBITMQ_ERLANG_COOKIE: PHPForgeRabbitCookie1234567890
      RABBITMQ_NODENAME: rabbit@rabbitmq-replica-2
    depends_on:
      rabbitmq-primary: {condition: service_healthy}
    healthcheck: *rabbitmq-health

  rabbitmq-cluster-init:
    image: rabbitmq:4.3-management-alpine
    profiles: [rabbitmq-cluster]
    hostname: rabbitmq-cluster-init
    environment:
      RABBITMQ_ERLANG_COOKIE: PHPForgeRabbitCookie1234567890
    depends_on:
      rabbitmq-primary: {condition: service_healthy}
      rabbitmq-replica-1: {condition: service_healthy}
      rabbitmq-replica-2: {condition: service_healthy}
    volumes:
      - ./rabbitmq/configure-cluster.sh:/configure-cluster.sh:ro
    entrypoint: ["sh", "/configure-cluster.sh"]

  nats:
    image: nats:2.14-alpine
    profiles: [nats]
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck: &nats-health
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 3s
      timeout: 3s
      retries: 30

  nats-primary:
    image: nats:2.14-alpine
    profiles: [nats-cluster]
    command: ["--name", "nats-primary", "--jetstream", "--store_dir=/data", "--http_port=8222", "--cluster_name", "phpforge", "--cluster", "nats://0.0.0.0:6222", "--routes", "nats://nats-replica-1:6222,nats://nats-replica-2:6222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck: *nats-health

  nats-replica-1:
    image: nats:2.14-alpine
    profiles: [nats-cluster]
    command: ["--name", "nats-replica-1", "--jetstream", "--store_dir=/data", "--http_port=8222", "--cluster_name", "phpforge", "--cluster", "nats://0.0.0.0:6222", "--routes", "nats://nats-primary:6222,nats://nats-replica-2:6222"]
    ports: ["4223:4222", "8223:8222"]
    healthcheck: *nats-health

  nats-replica-2:
    image: nats:2.14-alpine
    profiles: [nats-cluster]
    command: ["--name", "nats-replica-2", "--jetstream", "--store_dir=/data", "--http_port=8222", "--cluster_name", "phpforge", "--cluster", "nats://0.0.0.0:6222", "--routes", "nats://nats-primary:6222,nats://nats-replica-1:6222"]
    ports: ["4224:4222", "8224:8222"]
    healthcheck: *nats-health

  mailpit:
    image: axllent/mailpit:v1.30
    profiles: [mailpit]
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 3s
      timeout: 3s
      retries: 30

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    profiles: [elasticsearch]
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow"]
      interval: 5s
      timeout: 5s
      retries: 40

  elasticsearch-primary:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    profiles: [elasticsearch-cluster]
    ports: ["9200:9200"]
    environment: &elasticsearch-cluster-environment
      cluster.name: phpforge
      discovery.seed_hosts: elasticsearch-primary,elasticsearch-replica
      cluster.initial_master_nodes: elasticsearch-primary,elasticsearch-replica
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      node.name: elasticsearch-primary
    healthcheck: &elasticsearch-cluster-health
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow"]
      interval: 5s
      timeout: 5s
      retries: 40

  elasticsearch-replica:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    profiles: [elasticsearch-cluster]
    ports: ["9201:9200"]
    environment:
      <<: *elasticsearch-cluster-environment
      node.name: elasticsearch-replica
    healthcheck: *elasticsearch-cluster-health

  scylladb:
    image: scylladb/scylla:2026.2
    profiles: [scylladb]
    command: ["--reactor-backend", "epoll", "--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--alternator-port", "8000", "--alternator-write-isolation", "only_rmw_uses_lwt"]
    ports: ["8000:8000", "10000:10000"]
    healthcheck: &scylladb-health
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:10000/storage_service/scylla_release_version >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  scylladb-primary:
    image: scylladb/scylla:2026.2
    profiles: [scylladb-cluster]
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--alternator-port", "8000", "--alternator-write-isolation", "only_rmw_uses_lwt"]
    ports: ["8000:8000", "10000:10000"]
    healthcheck: *scylladb-health

  scylladb-replica-1:
    image: scylladb/scylla:2026.2
    profiles: [scylladb-cluster]
    command: ["--seeds", "scylladb-primary", "--reactor-backend", "epoll", "--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--alternator-port", "8000", "--alternator-write-isolation", "only_rmw_uses_lwt"]
    ports: ["8001:8000", "10001:10000"]
    depends_on:
      scylladb-primary: {condition: service_healthy}
    healthcheck: *scylladb-health

  scylladb-replica-2:
    image: scylladb/scylla:2026.2
    profiles: [scylladb-cluster]
    command: ["--seeds", "scylladb-primary", "--reactor-backend", "epoll", "--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--alternator-port", "8000", "--alternator-write-isolation", "only_rmw_uses_lwt"]
    ports: ["8002:8000", "10002:10000"]
    depends_on:
      scylladb-primary: {condition: service_healthy}
    healthcheck: *scylladb-health

volumes:
  mssql-shared:
