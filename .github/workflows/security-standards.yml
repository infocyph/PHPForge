name: "Security & Standards"

on:
  workflow_call:
    inputs:
      php_versions:
        description: "Optional JSON PHP version subset; defaults to PHPForge's runtime manifest."
        required: false
        type: string
        default: ""
      dependency_versions:
        description: "JSON array of Composer dependency modes."
        required: false
        type: string
        default: '["prefer-lowest","prefer-stable"]'
      php_extensions:
        description: "Additional comma-separated setup-php extensions."
        required: false
        type: string
        default: ""
      composer_flags:
        description: "Extra flags appended to Composer install/update."
        required: false
        type: string
        default: ""
      phpstan_memory_limit:
        description: "PHPStan memory limit."
        required: false
        type: string
        default: "1G"
      run_analysis:
        description: "Run the dedicated analyzer/SARIF job."
        required: false
        type: boolean
        default: true
      run_svg_report:
        description: "Generate SVG security report artifacts."
        required: false
        type: boolean
        default: true
      fail_on_skipped_tests:
        description: "Treat skipped Pest tests as failures."
        required: false
        type: boolean
        default: false
      run_clean_install:
        description: "Verify a production-style Composer install."
        required: false
        type: boolean
        default: true
      integration_services:
        description: "JSON string array of integration service names."
        required: false
        type: string
        default: '[]'
      service_topologies:
        description: "JSON service-to-topology object."
        required: false
        type: string
        default: '{}'
      service_db_name:
        description: "Shared database name used by integration services."
        required: false
        type: string
        default: "phpforge"
      service_db_user:
        description: "Shared username used by integration services."
        required: false
        type: string
        default: "phpforge"
      service_password:
        description: "Shared test password used by integration services."
        required: false
        type: string
        default: "Phpforge_123!"
      benchmark_composer_script:
        required: false
        type: string
        default: ""
      benchmark_result_file:
        required: false
        type: string
        default: ""
      benchmark_baseline_file:
        required: false
        type: string
        default: ""
      benchmark_max_regression_percent:
        required: false
        type: number
        default: 2
      benchmark_stable_environment:
        required: false
        type: boolean
        default: false
      artifact_retention_days:
        required: false
        type: number
        default: 61

jobs:
  prepare:
    name: Prepare CI matrix and services
    runs-on: ubuntu-latest
    outputs:
      php_versions: ${{ steps.matrix.outputs.php_versions }}
      dependency_versions: ${{ steps.matrix.outputs.dependency_versions }}
      clean_install_php_version: ${{ steps.matrix.outputs.clean_install_php_version }}
      has_supported_php_versions: ${{ steps.matrix.outputs.has_supported_php_versions }}
      integration_services: ${{ steps.services.outputs.integration_services }}
      service_topologies: ${{ steps.services.outputs.service_topologies }}
      compose_profiles: ${{ steps.services.outputs.compose_profiles }}
      php_extensions: ${{ steps.services.outputs.php_extensions }}
      has_external_services: ${{ steps.services.outputs.has_external_services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout workflow source
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .phpforge-workflow
          sparse-checkout: |
            .github/scripts/resolve-php-matrix.sh
            .github/scripts/resolve-services.php
            resources/runtime.php
            resources/services/catalog.php
          sparse-checkout-cone-mode: false

      - name: Resolve supported PHP matrix
        id: matrix
        shell: bash
        env:
          PHP_VERSIONS_INPUT: ${{ inputs.php_versions }}
        run: |
          supported="$(php -r '$runtime = require ".phpforge-workflow/resources/runtime.php"; echo json_encode($runtime["php_versions"], JSON_THROW_ON_ERROR);')"
          requested="$PHP_VERSIONS_INPUT"
          if [ -z "$requested" ]; then requested="$supported"; fi
          echo 'dependency_versions=${{ inputs.dependency_versions }}' >> "$GITHUB_OUTPUT"
          INPUT_PHP_VERSIONS="$requested" SUPPORTED_PHP_VERSIONS="$supported" \
            bash .phpforge-workflow/.github/scripts/resolve-php-matrix.sh

      - name: Resolve service profiles and PHP extensions
        id: services
        shell: bash
        env:
          INTEGRATION_SERVICES_INPUT: ${{ inputs.integration_services }}
          SERVICE_TOPOLOGIES_INPUT: ${{ inputs.service_topologies }}
          EXTRA_EXTENSIONS: ${{ inputs.php_extensions }}
        run: |
          composer_extensions="$(php -r '
          $composer = json_decode((string) file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
          $extensions = [];
          foreach (["require", "require-dev", "suggest"] as $section) {
              foreach (array_keys($composer[$section] ?? []) as $package) {
                  if (str_starts_with($package, "ext-")) $extensions[] = substr($package, 4);
              }
          }
          echo implode(",", array_values(array_unique($extensions)));
          ')"
          PHP_EXTENSIONS_INPUT="${composer_extensions},${EXTRA_EXTENSIONS}" \
            php .phpforge-workflow/.github/scripts/resolve-services.php

  run:
    needs: prepare
    if: needs.prepare.outputs.has_supported_php_versions == 'true'
    name: QA - PHP ${{ matrix.php-version }} - ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJson(needs.prepare.outputs.php_versions) }}
        dependency-version: ${{ fromJson(needs.prepare.outputs.dependency_versions) }}
    env:
      XDEBUG_MODE: off
      PHPFORGE_SERVICE_DATABASE: ${{ inputs.service_db_name }}
      PHPFORGE_SERVICE_USERNAME: ${{ inputs.service_db_user }}
      PHPFORGE_SERVICE_PASSWORD: ${{ inputs.service_password }}
      IC_SERVICE_DATABASE: ${{ inputs.service_db_name }}
      IC_SERVICE_USERNAME: ${{ inputs.service_db_user }}
      IC_SERVICE_PASSWORD: ${{ inputs.service_password }}
      IC_MSSQL_PASSWORD: ${{ inputs.service_password }}
      IC_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=${{ inputs.service_db_name }};charset=utf8mb4
      IC_MYSQL_PRIMARY_DSN: mysql:host=127.0.0.1;port=3306;dbname=${{ inputs.service_db_name }};charset=utf8mb4
      IC_MYSQL_REPLICA_DSN: mysql:host=127.0.0.1;port=3307;dbname=${{ inputs.service_db_name }};charset=utf8mb4
      IC_MYSQL_USER: ${{ inputs.service_db_user }}
      IC_MYSQL_PASSWORD: ${{ inputs.service_password }}
      IC_MARIADB_DSN: mysql:host=127.0.0.1;port=3308;dbname=${{ inputs.service_db_name }};charset=utf8mb4
      IC_MARIADB_PRIMARY_DSN: mysql:host=127.0.0.1;port=3308;dbname=${{ inputs.service_db_name }};charset=utf8mb4
      IC_MARIADB_REPLICA_DSN: mysql:host=127.0.0.1;port=3309;dbname=${{ inputs.service_db_name }};charset=utf8mb4
      IC_MARIADB_USER: ${{ inputs.service_db_user }}
      IC_MARIADB_PASSWORD: ${{ inputs.service_password }}
      IC_POSTGRES_DSN: pgsql:host=127.0.0.1;port=5432;dbname=${{ inputs.service_db_name }}
      IC_POSTGRES_PRIMARY_DSN: pgsql:host=127.0.0.1;port=5432;dbname=${{ inputs.service_db_name }}
      IC_POSTGRES_REPLICA_DSN: pgsql:host=127.0.0.1;port=5433;dbname=${{ inputs.service_db_name }}
      IC_POSTGRES_USER: ${{ inputs.service_db_user }}
      IC_POSTGRES_PASSWORD: ${{ inputs.service_password }}
      IC_MSSQL_DSN: sqlsrv:Server=127.0.0.1,1433;TrustServerCertificate=1
      IC_MSSQL_USER: sa
      IC_SQLITE_MEMORY_DSN: "sqlite::memory:"
      IC_SQLITE_FILE_DSN: sqlite:/tmp/phpforge.sqlite
      IC_MONGODB_DSN: ${{ fromJson(needs.prepare.outputs.service_topologies).mongodb == 'replica-set' && 'mongodb://127.0.0.1:27017/?replicaSet=phpforge-rs&directConnection=true' || format('mongodb://{0}:{1}@127.0.0.1:27017/{2}?authSource=admin', inputs.service_db_user, inputs.service_password, inputs.service_db_name) }}
      IC_MONGODB_REPLICA_SET: ${{ fromJson(needs.prepare.outputs.service_topologies).mongodb == 'replica-set' && 'phpforge-rs' || '' }}
      IC_REDIS_HOST: 127.0.0.1
      IC_REDIS_PORT: 6379
      IC_REDIS_PASSWORD: ${{ inputs.service_password }}
      IC_VALKEY_HOST: 127.0.0.1
      IC_VALKEY_PORT: 6380
      IC_VALKEY_PASSWORD: ${{ inputs.service_password }}
      IC_MEMCACHED_HOST: 127.0.0.1
      IC_MEMCACHED_PORT: 11211
      IC_RABBITMQ_HOST: 127.0.0.1
      IC_RABBITMQ_PORT: 5672
      IC_RABBITMQ_DSN: ${{ format('amqp://{0}:{1}@127.0.0.1:5672', inputs.service_db_user, inputs.service_password) }}
      IC_RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
      IC_NATS_URL: nats://127.0.0.1:4222
      IC_NATS_MONITOR_URL: http://127.0.0.1:8222
      IC_SMTP_HOST: 127.0.0.1
      IC_SMTP_PORT: 1025
      IC_SMTP_DSN: smtp://127.0.0.1:1025
      IC_MAILPIT_URL: http://127.0.0.1:8025
      IC_MAILPIT_API_URL: http://127.0.0.1:8025/api
      IC_ELASTICSEARCH_HOST: 127.0.0.1
      IC_ELASTICSEARCH_PORT: 9200
      IC_ELASTICSEARCH_URL: http://127.0.0.1:9200
      IC_SCYLLADB_HOST: 127.0.0.1
      IC_SCYLLADB_PORT: 8000
      IC_SCYLLADB_ENDPOINT: http://127.0.0.1:8000
      IC_SCYLLADB_REGION: us-east-1
      IC_SCYLLADB_ACCESS_KEY_ID: ${{ inputs.service_db_user }}
      IC_SCYLLADB_SECRET_ACCESS_KEY: ${{ inputs.service_password }}
      INTEGRATION_SERVICES: ${{ needs.prepare.outputs.integration_services }}
      SERVICE_TOPOLOGIES: ${{ needs.prepare.outputs.service_topologies }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout workflow service layer
        if: needs.prepare.outputs.has_external_services == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .phpforge-workflow
          sparse-checkout: |
            .github/scripts/verify-and-wait-services.sh
            resources/services
          sparse-checkout-cone-mode: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: ${{ needs.prepare.outputs.php_extensions }}
          ini-values: ${{ contains(needs.prepare.outputs.php_extensions, 'apcu') && 'apc.enable_cli=1, apcu.enable_cli=1' || '' }}
          coverage: none
      - name: Start selected services
        if: needs.prepare.outputs.has_external_services == 'true'
        shell: bash
        env:
          COMPOSE_PROFILES_JSON: ${{ needs.prepare.outputs.compose_profiles }}
        run: |
          compose=(docker compose -f .phpforge-workflow/resources/services/compose.yml)
          while IFS= read -r profile; do compose+=(--profile "$profile"); done < <(jq -r '.[]' <<< "$COMPOSE_PROFILES_JSON")
          "${compose[@]}" up -d
          bash .phpforge-workflow/.github/scripts/verify-and-wait-services.sh
      - name: Validate and resolve dependencies
        shell: bash
        run: |
          package="$(composer config name --no-plugins --no-scripts 2>/dev/null || true)"
          if [ "$package" = "infocyph/phpforge" ]; then composer validate; else composer validate --strict; fi
          composer update --no-interaction --prefer-dist --no-progress --${{ matrix.dependency-version }} ${{ inputs.composer_flags }}
          composer ic:release:constraints
      - name: Run quality suite once
        shell: bash
        env:
          IC_PHPSTAN_MEMORY_LIMIT: ${{ inputs.phpstan_memory_limit }}
          IC_PEST_FAIL_ON_SKIPPED: ${{ inputs.fail_on_skipped_tests }}
        run: |
          args=()
          if [ "${{ matrix.dependency-version }}" = "prefer-lowest" ]; then args+=(--prefer-lowest); fi
          if [ "${{ inputs.run_analysis }}" = "true" ]; then args+=(--without-analysis); fi
          if [ "${#args[@]}" -eq 0 ]; then composer ic:ci; else composer ic:ci "${args[@]}"; fi
      - name: Stop selected services
        if: always() && needs.prepare.outputs.has_external_services == 'true'
        shell: bash
        env:
          COMPOSE_PROFILES_JSON: ${{ needs.prepare.outputs.compose_profiles }}
        run: |
          compose=(docker compose -f .phpforge-workflow/resources/services/compose.yml)
          while IFS= read -r profile; do compose+=(--profile "$profile"); done < <(jq -r '.[]' <<< "$COMPOSE_PROFILES_JSON")
          "${compose[@]}" down --volumes --remove-orphans

  clean-install:
    needs: prepare
    if: inputs.run_clean_install && needs.prepare.outputs.has_supported_php_versions == 'true'
    name: Clean install
    runs-on: ubuntu-latest
    env:
      XDEBUG_MODE: off
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.prepare.outputs.clean_install_php_version }}
          tools: composer:v2
          extensions: ${{ needs.prepare.outputs.php_extensions }}
          coverage: none
      - run: composer install --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative ${{ inputs.composer_flags }}
      - run: composer check-platform-reqs --no-dev
      - run: php -r 'require "vendor/autoload.php";'

  analyze:
    needs: prepare
    if: inputs.run_analysis && needs.prepare.outputs.has_supported_php_versions == 'true'
    name: Analysis - PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJson(needs.prepare.outputs.php_versions) }}
    permissions:
      security-events: write
      actions: read
      contents: read
    env:
      XDEBUG_MODE: off
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: ${{ needs.prepare.outputs.php_extensions }}
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress ${{ inputs.composer_flags }}
      - name: Run audit and analyzers once
        id: analyzers
        shell: bash
        env:
          PHPSTAN_MEMORY_LIMIT: ${{ inputs.phpstan_memory_limit }}
        run: |
          set +e
          composer ic:release:audit
          audit_status=$?
          vendor_dir="$(composer config vendor-dir)"
          package="$(composer config name --no-plugins --no-scripts 2>/dev/null || true)"
          if [ -f phpstan.neon ]; then phpstan_config=phpstan.neon
          elif [ -f phpstan.neon.dist ]; then phpstan_config=phpstan.neon.dist
          elif [ "$package" = infocyph/phpforge ]; then phpstan_config=resources/phpstan.neon.dist
          else phpstan_config="$vendor_dir/infocyph/phpforge/resources/phpstan.neon.dist"; fi
          php "$vendor_dir/bin/phpstan" analyse --configuration="$phpstan_config" --memory-limit="$PHPSTAN_MEMORY_LIMIT" --no-progress --error-format=json > phpstan-results.json
          phpstan_status=$?
          composer ic:phpstan:sarif -- phpstan-results.json phpstan-results.sarif
          sarif_status=$?
          if [ -f psalm.xml ]; then psalm_config=psalm.xml
          elif [ -f psalm.xml.dist ]; then psalm_config=psalm.xml.dist
          elif [ "$package" = infocyph/phpforge ]; then psalm_config=resources/psalm.xml
          else psalm_config="$vendor_dir/infocyph/phpforge/resources/psalm.xml"; fi
          php "$vendor_dir/bin/psalm.phar" --config="$psalm_config" --security-analysis --threads=1 --no-progress --no-cache --report=psalm-results.sarif
          psalm_status=$?
          set -e
          printf 'audit_status=%d\nphpstan_status=%d\nsarif_status=%d\npsalm_status=%d\n' "$audit_status" "$phpstan_status" "$sarif_status" "$psalm_status" >> "$GITHUB_OUTPUT"
      - name: Upload PHPStan SARIF
        if: always() && hashFiles('phpstan-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: phpstan-results.sarif
          category: phpstan-${{ matrix.php-version }}
      - name: Upload Psalm SARIF
        if: always() && hashFiles('psalm-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: psalm-results.sarif
          category: psalm-${{ matrix.php-version }}
      - name: Enforce analyzer results
        if: always()
        shell: bash
        run: |
          failures=()
          [ "${{ steps.analyzers.outputs.audit_status }}" = 0 ] || failures+=(audit)
          [ "${{ steps.analyzers.outputs.phpstan_status }}" = 0 ] || failures+=(phpstan)
          [ "${{ steps.analyzers.outputs.sarif_status }}" = 0 ] || failures+=(phpstan-sarif)
          [ "${{ steps.analyzers.outputs.psalm_status }}" = 0 ] || failures+=(psalm)
          if [ "${#failures[@]}" -gt 0 ]; then echo "::error::Analysis failed: ${failures[*]}"; exit 1; fi

  benchmark:
    needs: prepare
    if: needs.prepare.outputs.has_supported_php_versions == 'true' && (inputs.benchmark_composer_script != '' || inputs.benchmark_result_file != '' || (inputs.run_svg_report && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    name: Benchmark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ${{ fromJson(needs.prepare.outputs.php_versions) }}
    env:
      XDEBUG_MODE: off
    steps:
      - uses: actions/checkout@v7
      - name: Setup benchmark - PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: ${{ needs.prepare.outputs.php_extensions }}
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable ${{ inputs.composer_flags }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .phpforge-workflow
          sparse-checkout: .github/scripts/run-benchmark.sh
          sparse-checkout-cone-mode: false
      - name: Run benchmark
        shell: bash
        env:
          INPUT_BENCHMARK_COMPOSER_SCRIPT: ${{ inputs.benchmark_composer_script }}
        run: bash .phpforge-workflow/.github/scripts/run-benchmark.sh
      - name: Store benchmark JSON
        if: always()
        shell: bash
        run: |
          mkdir -p .phpforge-report
          if [ -s .phpforge-report/benchmark-output.log ] && jq -e . .phpforge-report/benchmark-output.log >/dev/null 2>&1; then
            jq -c 'if type == "array" then . else [] end' .phpforge-report/benchmark-output.log > .phpforge-report/benchmark-results-php-${{ matrix.php-version }}.json
          else
            echo '[]' > .phpforge-report/benchmark-results-php-${{ matrix.php-version }}.json
          fi
      - if: inputs.benchmark_result_file != ''
        run: composer ic:benchmark:validate "${{ inputs.benchmark_result_file }}"
      - if: inputs.benchmark_result_file != '' && inputs.benchmark_baseline_file != '' && matrix.php-version == needs.prepare.outputs.clean_install_php_version
        shell: bash
        run: |
          args=(ic:benchmark:compare "${{ inputs.benchmark_baseline_file }}" "${{ inputs.benchmark_result_file }}" "--max-regression=${{ inputs.benchmark_max_regression_percent }}")
          if [ "${{ inputs.benchmark_stable_environment }}" = true ]; then args+=(--stable-environment); fi
          composer "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-raw-php-${{ matrix.php-version }}
          path: .phpforge-report/benchmark-results-php-${{ matrix.php-version }}.json
          retention-days: ${{ inputs.artifact_retention_days }}

  svg-report:
    needs: [prepare, run, analyze, benchmark]
    if: always() && needs.prepare.outputs.has_supported_php_versions == 'true' && inputs.run_svg_report && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    name: Security SVG report
    runs-on: ubuntu-latest
    env:
      XDEBUG_MODE: off
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.prepare.outputs.clean_install_php_version }}
          tools: composer:v2
          extensions: ${{ needs.prepare.outputs.php_extensions }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress ${{ inputs.composer_flags }}
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .phpforge-workflow
          sparse-checkout: .github/scripts/build-security-report.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-raw-php-*
          path: .phpforge-report/in/benchmark
          merge-multiple: true
      - name: Build report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_RESULT: ${{ needs.run.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          BENCHMARK_JOB_RESULT: ${{ needs.benchmark.result }}
          PHP_VERSIONS_INPUT: ${{ needs.prepare.outputs.php_versions }}
        run: bash .phpforge-workflow/.github/scripts/build-security-report.sh
      - uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: |
            .phpforge-report/out/security-report.svg
            .phpforge-report/out/security-summary.json
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
