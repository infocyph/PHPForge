name: "PHPForge"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  security-standards:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/security-standards.yml
    with:
      run_qa: true
      run_analysis: true
      upload_sarif: true
      run_benchmark: true
      fail_on_skipped_tests: true
      integration_services: '[]'
      service_topologies: '{}'
    permissions:
      security-events: write
      actions: read
      contents: read

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
